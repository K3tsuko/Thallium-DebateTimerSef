<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BP Debate Timer — British Parliamentary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/index.css">
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: background-color 600ms ease, color 400ms ease;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-variant-numeric: tabular-nums;
        }

        .timer-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.25), 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .btn-press {
            transition: transform 80ms ease, box-shadow 80ms ease, background-color 120ms ease;
        }

        .btn-press:active {
            transform: scale(0.96);
        }

        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        .scroll-hide {
            scrollbar-width: none;
        }

        body.phase-black {
            background-color: #0b132b;
            color: #fff;
        }

        body.phase-green {
            background-color: #0f5132;
            color: #fff;
        }

        body.phase-yellow {
            background-color: #b45309;
            color: #fff;
        }

        body.phase-red {
            background-color: #7f1d1d;
            color: #fff;
        }

        body.phase-prep {
            background-color: #1e293b;
            color: #fff;
        }

        .phase-green .timer-glow {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.35), 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .phase-yellow .timer-glow {
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        }

        .phase-red .timer-glow {
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.4);
        }

        @keyframes blinkRed {

            0%,
            100% {
                background-color: #7f1d1d;
            }

            50% {
                background-color: #991b1b;
            }
        }

        body.phase-red.overtime-blink {
            animation: blinkRed 1s ease-in-out infinite;
        }

        .speaker-card {
            transition: all 300ms ease;
        }

        .speaker-card.active {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important;
            transform: scale(1.05);
        }

        .speaker-card.done {
            opacity: 0.5;
        }

        .team-badge-OG,
        .team-badge-CG {
            background: #1d4ed8;
        }

        .team-badge-OO,
        .team-badge-CO {
            background: #b91c1c;
        }

        .poi-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poi-ring {
            width: min(85vw, 420px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.15);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poi-ring svg {
            position: absolute;
            inset: -8px;
            transform: rotate(-90deg);
        }

        .hidden-view {
            display: none !important;
        }

        /* 1. RIPPLE EFFECT STYLES */
        .ripple-effect {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background-color: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 0;
            will-change: transform, opacity;
            animation: lightweightRipple 1.2s ease-out forwards;
        }

        @keyframes lightweightRipple {
            0% {
                transform: scale(0.1) translateZ(0);
                opacity: 1;
            }

            100% {
                transform: scale(2) translateZ(0);
                opacity: 0;
            }
        }

        /* Ensure container views have stacking contexts so the ripple stays in the background */
        #mainView,
        #prepView {
            position: relative;
            z-index: 10;
        }
    </style>
</head>

<body class="phase-black">

    <!-- ========== MAIN VIEW ========== -->
    <div id="mainView" class="min-h-screen flex flex-col p-4 md:p-6">

        <header class="flex items-center justify-between gap-3 mb-4">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-white/80 hidden md:block"></div>
                <h1 class="text-sm md:text-base font-bold tracking-widest uppercase opacity-80">BP Debate Timer</h1>
                <div class="flex items-center gap-1 ml-1 md:ml-2">
                    <button id="subTimeBtn"
                        class="btn-press px-2 py-1 rounded bg-white/10 hover:bg-white/20 text-xs font-mono font-bold"
                        title="-10s">«</button>
                    <button id="addTimeBtn"
                        class="btn-press px-2 py-1 rounded bg-white/10 hover:bg-white/20 text-xs font-mono font-bold"
                        title="+10s">»</button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="wakeLockBtn"
                    class="btn-press px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs md:text-sm font-semibold flex items-center gap-1.5"
                    title="Keep screen awake">
                    <span id="wakeLockIcon">🔓</span>
                    <span id="wakeLockText" class="hidden sm:inline">Wake Lock</span>
                </button>
                <button id="logsBtn"
                    class="btn-press px-3 py-2 rounded-lg bg-blue-600/80 hover:bg-blue-600 text-xs md:text-sm font-semibold border border-blue-500/50">
                    📊 Logs
                </button>
                <button id="toPrepBtn"
                    class="btn-press px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs md:text-sm font-semibold">
                    📝 Prep
                </button>
            </div>
        </header>

        <section class="mb-4">
            <div id="speakerProgress" class="grid grid-cols-4 md:grid-cols-8 gap-2"></div>
        </section>

        <section class="flex-1 flex flex-col items-center justify-center w-full px-1 md:px-4">
            <div class="z-10 flex flex-col items-center justify-center px-2 md:px-6">
                <div class="text-center mb-2">
                    <div id="teamBadge"
                        class="inline-block px-3 py-1 rounded-full text-xs md:text-sm font-bold uppercase tracking-wider mb-2 team-badge-OG">
                        <span id="teamLabel">Opening Government</span>
                    </div>
                    <h2 id="speakerName" class="text-2xl md:text-4xl font-extrabold tracking-tight">Prime Minister</h2>
                    <p id="phaseLabel"
                        class="mt-2 text-sm md:text-base font-semibold uppercase tracking-[0.2em] opacity-90">Protected
                        Time</p>
                </div>
                <div id="mainTimer" class="mono timer-glow font-black text-center leading-none my-4 md:my-8"
                    style="font-size: clamp(4.5rem, 18vw, 18rem);">
                    0:00
                </div>
            </div>
        </section>

        <section id="poiSection" class="hidden mb-4 w-full flex justify-center px-1 md:px-4">
            <button id="poiBtn"
                class="btn-press px-8 py-4 md:px-12 md:py-5 rounded-2xl bg-white text-black font-black text-xl md:text-3xl tracking-widest shadow-2xl hover:scale-105">
                💬 POI · 15s (Space)
            </button>
        </section>

        <section class="w-full space-y-3 pb-28 md:pb-32 px-1 md:px-4 mt-2">
            <div class="grid grid-cols-4 gap-2 md:gap-3">
                <button id="prevBtn"
                    class="btn-press py-4 md:py-5 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-sm md:text-lg border border-white/20">◀
                    Prev</button>
                <button id="playBtn"
                    class="btn-press py-4 md:py-5 rounded-xl bg-white text-black font-black text-sm md:text-xl shadow-xl">▶
                    Start</button>
                <button id="nextBtn"
                    class="btn-press py-4 md:py-5 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-sm md:text-lg border border-white/20">Save
                    & Next ▶</button>
                <button id="resetBtn"
                    class="btn-press py-4 md:py-5 rounded-xl bg-red-600 hover:bg-red-700 font-black text-sm md:text-lg shadow-xl">↻
                    RESET</button>
            </div>
            <div class="mt-2">
                <button id="manualBellBtn"
                    class="w-full btn-press py-3 rounded-xl bg-amber-600/80 hover:bg-amber-600 font-bold text-sm md:text-lg border border-amber-500/50">🔔
                    Manual Bell</button>
            </div>
        </section>
    </div>

    <!-- ========== PREP VIEW ========== -->
    <div id="prepView" class="hidden-view min-h-screen flex flex-col p-4 md:p-6 phase-prep">
        <header class="flex items-center justify-between gap-3 mb-4">
            <h1 class="text-sm md:text-base font-bold tracking-widest uppercase opacity-80">📝 15-Minute Prep Timer</h1>
            <button id="toMainBtn"
                class="btn-press px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm font-semibold">← Back to
                Debate</button>
        </header>
        <section class="flex-1 flex flex-col items-center justify-center min-h-[60vh]">
            <p class="text-base md:text-xl uppercase tracking-[0.3em] opacity-70 mb-4">Preparation Time Remaining</p>
            <div id="prepTimer" class="mono timer-glow font-black text-center leading-none"
                style="font-size: clamp(5rem, 26vw, 20rem);">15:00</div>
            <p id="prepStatus" class="mt-4 text-base md:text-lg font-semibold opacity-80">Ready to start</p>
        </section>
        <section class="space-y-3 pb-4">
            <div class="grid grid-cols-3 gap-3">
                <button id="prepPlayBtn"
                    class="btn-press py-5 md:py-6 rounded-xl bg-white text-black font-black text-lg md:text-2xl shadow-xl">▶
                    Start</button>
                <button id="prepPauseBtn"
                    class="btn-press py-5 md:py-6 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-lg md:text-2xl border border-white/20">⏸
                    Pause</button>
                <button id="prepResetBtn"
                    class="btn-press py-5 md:py-6 rounded-xl bg-red-600 hover:bg-red-700 font-black text-lg md:text-2xl shadow-xl">↻
                    Reset</button>
            </div>
            <div class="grid grid-cols-4 gap-2 text-xs md:text-sm font-semibold">
                <button data-prep-add="-60"
                    class="prepAddBtn btn-press py-3 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20">-1
                    min</button>
                <button data-prep-add="60"
                    class="prepAddBtn btn-press py-3 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20">+1
                    min</button>
                <button data-prep-add="120"
                    class="prepAddBtn btn-press py-3 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20">+2
                    min</button>
                <button data-prep-add="300"
                    class="prepAddBtn btn-press py-3 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20">+5
                    min</button>
            </div>
            <div class="grid grid-cols-1 mt-2">
                <button id="prepBellBtn"
                    class="btn-press py-3 rounded-lg bg-amber-600 hover:bg-amber-700 text-xs md:text-sm font-semibold">🔔
                    Test Bell</button>
            </div>
        </section>
    </div>

    <!-- ========== POI OVERLAY ========== -->
    <div id="poiOverlay" class="poi-overlay hidden-view">
        <div class="text-center">
            <p class="text-sm md:text-lg uppercase tracking-[0.3em] opacity-80 mb-4">Point of Information</p>
            <div class="poi-ring">
                <svg viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="92" fill="none" stroke="white" stroke-width="6" stroke-dasharray="578"
                        stroke-dashoffset="0" stroke-linecap="round" id="poiCircle" />
                </svg>
                <div id="poiTimer" class="mono font-black" style="font-size: clamp(5rem, 18vw, 11rem);">15</div>
            </div>
            <p class="mt-6 text-base md:text-xl font-bold opacity-80">Speaker has 15 seconds</p>
            <button id="poiCloseBtn"
                class="btn-press mt-6 px-8 py-3 rounded-xl bg-white/10 hover:bg-white/20 font-bold border border-white/20">✕
                Dismiss</button>
        </div>
    </div>

    <!-- ========== LOGS MODAL ========== -->
    <div id="logsModal" class="hidden-view fixed inset-0 bg-black/95 z-[60] flex flex-col p-4 md:p-8">
        <div class="w-full max-w-5xl mx-auto bg-gray-900 border border-white/20 rounded-2xl flex flex-col overflow-hidden shadow-2xl"
            style="max-height: 90vh;">

            <!-- Header -->
            <div
                class="flex justify-between items-center p-4 md:p-6 border-b border-white/10 bg-black/50 flex-shrink-0">
                <h2 class="text-xl md:text-3xl font-bold">📊 Debate Time Logs</h2>
                <div class="flex gap-2">
                    <button id="clearLogsBtn"
                        class="btn-press px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg font-bold text-sm">Clear
                        Data</button>
                    <button id="closeLogsBtn"
                        class="btn-press px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg font-bold text-sm">✕
                        Close</button>
                </div>
            </div>

            <!-- Log columns -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 overflow-y-auto p-4 md:p-6 gap-6 md:gap-8">
                <div class="flex flex-col gap-3">
                    <h3
                        class="text-lg font-black text-blue-400 uppercase tracking-widest border-b border-white/10 pb-2">
                        Government</h3>
                    <div id="govLogsContainer" class="space-y-3"></div>
                </div>
                <div class="flex flex-col gap-3">
                    <h3 class="text-lg font-black text-red-400 uppercase tracking-widest border-b border-white/10 pb-2">
                        Opposition</h3>
                    <div id="oppLogsContainer" class="space-y-3"></div>
                </div>
            </div>

            <!-- Summary footer -->
            <div
                class="flex-shrink-0 border-t border-white/10 px-4 md:px-6 py-4 bg-black/30 grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="text-xs text-blue-400 font-bold uppercase tracking-wider mb-1">Gov Total</div>
                    <div id="govTotalTime" class="mono text-xl md:text-2xl font-black">—</div>
                </div>
                <div>
                    <div class="text-xs text-white/50 font-bold uppercase tracking-wider mb-1">Speeches Logged</div>
                    <div id="totalLogged" class="mono text-xl md:text-2xl font-black">0 / 8</div>
                </div>
                <div>
                    <div class="text-xs text-red-400 font-bold uppercase tracking-wider mb-1">Opp Total</div>
                    <div id="oppTotalTime" class="mono text-xl md:text-2xl font-black">—</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ============ SPEAKERS DATA ============ */
        const SPEAKERS = [
            { name: 'Prime Minister', team: 'OG', teamFull: 'Opening Government' },
            { name: 'Leader of Opposition', team: 'OO', teamFull: 'Opening Opposition' },
            { name: 'Deputy Prime Minister', team: 'OG', teamFull: 'Opening Government' },
            { name: 'Deputy Leader of Opposition', team: 'OO', teamFull: 'Opening Opposition' },
            { name: 'Member of Government', team: 'CG', teamFull: 'Closing Government' },
            { name: 'Member of Opposition', team: 'CO', teamFull: 'Closing Opposition' },
            { name: 'Government Whip', team: 'CG', teamFull: 'Closing Government' },
            { name: 'Opposition Whip', team: 'CO', teamFull: 'Closing Opposition' }
        ];

        /* ============ LOGS PERSISTENCE ============ */
        function loadLogs() {
            try {
                const saved = localStorage.getItem('bp_debate_logs');
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                console.warn('Failed to load logs from localStorage:', e);
                return {};
            }
        }

        /* ============ STATE ============ */
        const state = {
            speakerIndex: 0,
            elapsedMs: 0,
            running: false,
            lastTick: 0,
            firedBells: new Set(),
            overtimeInterval: null,
            // Prep timer
            prepElapsedMs: 0,
            prepTotalMs: 15 * 60 * 1000,
            prepRunning: false,
            prepLastTick: 0,
            // POI
            poiActive: false,
            poiRemainingMs: 15000,
            poiLastTick: 0,
            poiInterval: null,
            // Wake lock & Audio
            wakeLock: null,
            audioCtx: null,
            currentPhaseKey: null,
            // Logs — keyed by speaker index ("0"–"7"). Persisted in localStorage.
            logs: loadLogs()
        };

        /* ============ AUDIO BELL ============ */
        function ensureAudio() {
            if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
            return state.audioCtx;
        }

        // 2. TRIGGER FUNCTION
        function triggerRippleEffect() {
            // Detect which timer is currently visible
            const isPrep = !document.getElementById('prepView').classList.contains('hidden-view');
            const timerContainer = isPrep ? document.getElementById('prepTimer') : document.getElementById('mainTimer');

            if (!timerContainer) return;

            const rect = timerContainer.getBoundingClientRect();
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';

            const size = Math.max(rect.width, rect.height) * 1.2;

            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            ripple.style.left = (centerX - size / 2) + 'px';
            ripple.style.top = (centerY - size / 2) + 'px';

            // Insert at the beginning of the body so it sits behind text
            document.body.insertBefore(ripple, document.body.firstChild);

            setTimeout(() => {
                ripple.remove();
            }, 1500);
        }

        function playBell(count = 1) {
            const ctx = ensureAudio();
            const now = ctx.currentTime;
            for (let i = 0; i < count; i++) {
                // Triggers the visual ripple in sync with each bell ring
                setTimeout(() => triggerRippleEffect(), i * 450);

                const t = now + i * 0.45;
                const freqs = [523.25, 1046.5, 1568, 2093];
                const gains = [0.55, 0.35, 0.2, 0.1];
                const master = ctx.createGain();
                master.gain.setValueAtTime(0.0001, t);
                master.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
                master.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
                master.connect(ctx.destination);
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const g = ctx.createGain();
                    g.gain.value = gains[idx];
                    osc.connect(g); g.connect(master);
                    osc.start(t); osc.stop(t + 1.85);
                });
            }
        }

        /* ============ TIMER FORMAT ============ */
        function formatTime(ms, opts = {}) {
            const totalSec = Math.max(0, Math.floor(ms / 1000));
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            if (opts.showHour) {
                const h = Math.floor(m / 60);
                const rm = m % 60;
                return `${h}:${String(rm).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        /* ============ SPEAKER UI ============ */
        function renderSpeakerProgress() {
            const wrap = document.getElementById('speakerProgress');
            wrap.innerHTML = '';
            SPEAKERS.forEach((sp, idx) => {
                const isActive = idx === state.speakerIndex;
                const isDone = idx < state.speakerIndex;
                const isLogged = !!state.logs[String(idx)];
                const div = document.createElement('div');
                div.className = `speaker-card rounded-lg px-2 py-2 md:py-3 border-2 border-white/20 text-center ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`;
                div.innerHTML = `
                    <div class="text-[10px] md:text-xs font-bold uppercase tracking-wider opacity-80">${sp.team}</div>
                    <div class="text-[11px] md:text-sm font-bold mt-0.5 truncate">${shortenName(sp.name)}</div>
                    ${isLogged ? '<div class="text-[9px] font-black mt-0.5" style="color:' + (isActive ? '#16a34a' : '#4ade80') + '">✓ logged</div>' : ''}
                `;
                wrap.appendChild(div);
            });
        }

        function shortenName(n) {
            const map = {
                'Prime Minister': 'PM', 'Leader of Opposition': 'LO',
                'Deputy Prime Minister': 'DPM', 'Deputy Leader of Opposition': 'DLO',
                'Member of Government': 'MG', 'Member of Opposition': 'MO',
                'Government Whip': 'GW', 'Opposition Whip': 'OW'
            };
            return map[n] || n;
        }

        function updateSpeakerInfo() {
            const sp = SPEAKERS[state.speakerIndex];
            document.getElementById('speakerName').textContent = sp.name;
            document.getElementById('teamLabel').textContent = sp.teamFull;
            const badge = document.getElementById('teamBadge');
            badge.className = `inline-block px-3 py-1 rounded-full text-xs md:text-sm font-bold uppercase tracking-wider mb-2 team-badge-${sp.team}`;
            renderSpeakerProgress();
        }

        /* ============ LOGGING SYSTEM ============ */
        /*
         * Logs are stored as an object keyed by speaker index string ("0"–"7").
         * Each speaker has exactly one entry — overwritten if they speak again.
         *
         * Logs are saved ONLY when:
         *   - "Save & Next" is clicked (nextSpeaker)
         *   - Auto-advance fires at 7:20 (via nextSpeaker inside tick)
         *
         * Logs are NOT saved on:
         *   - RESET (discards the current attempt)
         *   - Prev (navigating backwards without finishing)
         *   - Enter key (same as reset)
         */
        function saveCurrentLog() {
            if (state.elapsedMs < 1000) return; // ignore false-start / very short runs (less than 1s)
            const sp = SPEAKERS[state.speakerIndex];
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            state.logs[String(state.speakerIndex)] = {
                name: sp.name,
                team: sp.team,
                teamFull: sp.teamFull,
                timeStr: formatTime(state.elapsedMs),
                elapsedMs: state.elapsedMs,
                realTime: timestamp
            };
            try {
                localStorage.setItem('bp_debate_logs', JSON.stringify(state.logs));
            } catch (e) {
                console.warn('Failed to save logs to localStorage:', e);
            }
            renderLogs();
            renderSpeakerProgress();
        }

        function logCurrentSpeech() {
            if (state.elapsedMs >= 1000) saveCurrentLog();
        }

        function renderLogs() {
            const govContainer = document.getElementById('govLogsContainer');
            const oppContainer = document.getElementById('oppLogsContainer');
            govContainer.innerHTML = '';
            oppContainer.innerHTML = '';

            let hasGov = false, hasOpp = false;
            let govTotalMs = 0, oppTotalMs = 0, totalCount = 0;

            SPEAKERS.forEach((sp, idx) => {
                const log = state.logs[String(idx)];
                if (!log) return;
                totalCount++;

                const sec = log.elapsedMs != null ? Math.floor(log.elapsedMs / 1000) : -1;

                // Colour-code by BP timing: green = 6–7 min, yellow = short, red = over 7 min
                let timeClass = 'text-white';
                let statusBadge = '';
                if (sec >= 0) {
                    if (sec < 360) {
                        timeClass = 'text-yellow-400';
                        statusBadge = '<span class="text-[11px] font-semibold text-yellow-400">⚠ Short</span>';
                    } else if (sec <= 420) {
                        timeClass = 'text-green-400';
                        statusBadge = '<span class="text-[11px] font-semibold text-green-400">✓ On time</span>';
                    } else {
                        timeClass = 'text-red-400';
                        statusBadge = '<span class="text-[11px] font-semibold text-red-400">✕ Over time</span>';
                    }
                }

                const div = document.createElement('div');
                div.className = 'bg-white/5 border border-white/10 rounded-lg p-3 flex items-center justify-between gap-3';
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="text-[11px] font-bold text-white/50 uppercase mb-0.5">${log.team} · ${log.realTime}</div>
                        <div class="font-semibold truncate text-sm md:text-base">${log.name}</div>
                        <div class="mt-0.5">${statusBadge}</div>
                    </div>
                    <div class="mono text-xl md:text-2xl font-black bg-black/50 px-3 py-1 rounded-md border border-white/10 flex-shrink-0 ${timeClass}">${log.timeStr}</div>
                `;

                if (sp.team === 'OG' || sp.team === 'CG') {
                    govContainer.appendChild(div);
                    govTotalMs += log.elapsedMs || 0;
                    hasGov = true;
                } else {
                    oppContainer.appendChild(div);
                    oppTotalMs += log.elapsedMs || 0;
                    hasOpp = true;
                }
            });

            if (!hasGov) govContainer.innerHTML = '<p class="text-white/50 text-sm italic">No logs yet.</p>';
            if (!hasOpp) oppContainer.innerHTML = '<p class="text-white/50 text-sm italic">No logs yet.</p>';

            // Update summary footer
            document.getElementById('govTotalTime').textContent = govTotalMs > 0 ? formatTime(govTotalMs) : '—';
            document.getElementById('oppTotalTime').textContent = oppTotalMs > 0 ? formatTime(oppTotalMs) : '—';
            document.getElementById('totalLogged').textContent = `${totalCount} / 8`;
        }

        let clearConfirmTimeout = null;

        function clearLogs() {
            const btn = document.getElementById('clearLogsBtn');
            if (!btn.classList.contains('confirm-pending')) {
                // First click: transition to pending confirm state
                btn.classList.add('confirm-pending');
                btn.textContent = 'Confirm Clear?';
                btn.classList.remove('bg-red-600', 'hover:bg-red-700');
                btn.classList.add('bg-amber-600', 'hover:bg-amber-700');

                // Reset after 3 seconds if not clicked again
                clearConfirmTimeout = setTimeout(() => {
                    resetClearButton();
                }, 3000);
            } else {
                // Second click: perform the actual clear
                if (clearConfirmTimeout) {
                    clearTimeout(clearConfirmTimeout);
                    clearConfirmTimeout = null;
                }
                resetClearButton();

                state.logs = {};
                try {
                    localStorage.removeItem('bp_debate_logs');
                } catch (e) {
                    console.warn('Failed to clear logs from localStorage:', e);
                }
                renderLogs();
                renderSpeakerProgress();
            }
        }

        function resetClearButton() {
            const btn = document.getElementById('clearLogsBtn');
            if (btn) {
                btn.classList.remove('confirm-pending', 'bg-amber-600', 'hover:bg-amber-700');
                btn.classList.add('bg-red-600', 'hover:bg-red-700');
                btn.textContent = 'Clear Data';
            }
        }

        function toggleLogsModal(show) {
            const modal = document.getElementById('logsModal');
            if (show) {
                renderLogs();
                modal.classList.remove('hidden-view');
            } else {
                modal.classList.add('hidden-view');
                if (clearConfirmTimeout) {
                    clearTimeout(clearConfirmTimeout);
                    clearConfirmTimeout = null;
                }
                resetClearButton();
            }
        }

        /* ============ PHASE LOGIC ============ */
        function getPhase(elapsedSec) {
            if (elapsedSec < 60) return { key: 'black', label: 'Protected Time' };
            if (elapsedSec < 360) return { key: 'green', label: 'Open Time — POIs Allowed' };
            if (elapsedSec < 420) return { key: 'yellow', label: 'Protected Time' };
            return { key: 'red', label: elapsedSec >= 435 ? 'Overtime — Stop Speaking' : 'Overtime — Wrap Up' };
        }

        function updatePhaseUI() {
            const sec = Math.floor(state.elapsedMs / 1000);
            const phase = getPhase(sec);

            if (state.currentPhaseKey !== phase.key) {
                document.body.classList.remove('phase-black', 'phase-green', 'phase-yellow', 'phase-red');
                document.body.classList.add(`phase-${phase.key}`);
                state.currentPhaseKey = phase.key;
            }

            if (phase.key === 'red' && sec >= 435) {
                if (!document.body.classList.contains('overtime-blink')) document.body.classList.add('overtime-blink');
            } else {
                document.body.classList.remove('overtime-blink');
            }

            document.getElementById('phaseLabel').textContent = phase.label;

            const poiSection = document.getElementById('poiSection');
            if (phase.key === 'green' && state.running) {
                poiSection.classList.remove('hidden');
            } else {
                poiSection.classList.add('hidden');
            }
        }

        /* ============ BELL TRIGGERS ============ */
        function checkBells() {
            const sec = Math.floor(state.elapsedMs / 1000);
            if (sec >= 60 && !state.firedBells.has('60')) { playBell(1); state.firedBells.add('60'); }
            if (sec >= 360 && !state.firedBells.has('360')) { playBell(1); state.firedBells.add('360'); }
            if (sec >= 420 && !state.firedBells.has('420')) { playBell(2); state.firedBells.add('420'); }
            if (sec >= 435 && !state.overtimeInterval) {
                playBell(1);
                state.overtimeInterval = setInterval(() => { if (state.running) playBell(1); }, 750);
            }
        }

        /* ============ MAIN TIMER TICK ============ */
        function tick() {
            const now = performance.now();
            if (state.running) {
                state.elapsedMs += now - state.lastTick;
                if (state.elapsedMs >= 440000) {
                    state.elapsedMs = 440000;
                    nextSpeaker(); // logs before advancing
                    return;
                }
                checkBells();
            }
            state.lastTick = now;
            document.getElementById('mainTimer').textContent = formatTime(state.elapsedMs);
            updatePhaseUI();
        }

        function adjustTime(ms) {
            state.elapsedMs = Math.max(0, state.elapsedMs + ms);
            if (state.elapsedMs >= 440000) state.elapsedMs = 440000;

            const sec = Math.floor(state.elapsedMs / 1000);
            if (sec >= 60) state.firedBells.add('60'); else state.firedBells.delete('60');
            if (sec >= 360) state.firedBells.add('360'); else state.firedBells.delete('360');
            if (sec >= 420) state.firedBells.add('420'); else state.firedBells.delete('420');

            if (sec < 435 && state.overtimeInterval) {
                clearInterval(state.overtimeInterval);
                state.overtimeInterval = null;
            }
            document.getElementById('mainTimer').textContent = formatTime(state.elapsedMs);
            updatePhaseUI();
        }

        /* ============ CONTROLS ============ */
        function startTimer() {
            ensureAudio();
            state.running = true;
            state.lastTick = performance.now();
            document.getElementById('playBtn').innerHTML = '⏸ Pause';
            requestWakeLock();
        }

        function pauseTimer() {
            state.running = false;
            document.getElementById('playBtn').innerHTML = '▶ Resume';
            if (state.overtimeInterval) { clearInterval(state.overtimeInterval); state.overtimeInterval = null; }
        }

        function togglePlay() {
            if (state.running) pauseTimer(); else startTimer();
        }

        function resetCurrentSpeaker() {
            state.elapsedMs = 0;
            state.firedBells.clear();
            if (state.overtimeInterval) { clearInterval(state.overtimeInterval); state.overtimeInterval = null; }
            document.getElementById('mainTimer').textContent = '0:00';
            pauseTimer();
            document.getElementById('playBtn').innerHTML = '▶ Start';
            state.currentPhaseKey = null;
            updatePhaseUI();
        }

        function nextSpeaker() {
            logCurrentSpeech(); // save BEFORE changing index
            if (state.speakerIndex < SPEAKERS.length - 1) {
                state.speakerIndex++;
                resetCurrentSpeaker();
                updateSpeakerInfo();
            } else {
                resetCurrentSpeaker();
            }
        }

        function prevSpeaker() {
            // Going back does NOT log — the current speaker hasn't finished
            if (state.speakerIndex > 0) {
                state.speakerIndex--;
                resetCurrentSpeaker();
                updateSpeakerInfo();
            }
        }

        /* ============ POI ============ */
        function startPOI() {
            if (state.poiActive) return;
            state.poiActive = true;
            state.poiRemainingMs = 15000;
            state.poiLastTick = performance.now();
            document.getElementById('poiOverlay').classList.remove('hidden-view');
            updatePOIDisplay();
            state.poiInterval = setInterval(tickPOI, 50);
        }

        function tickPOI() {
            const now = performance.now();
            state.poiRemainingMs -= now - state.poiLastTick;
            state.poiLastTick = now;
            if (state.poiRemainingMs <= 0) {
                state.poiRemainingMs = 0;
                closePOI();
                playBell(1);
                return;
            }
            updatePOIDisplay();
        }

        function updatePOIDisplay() {
            const secs = Math.ceil(state.poiRemainingMs / 1000);
            document.getElementById('poiTimer').textContent = secs;
            const pct = state.poiRemainingMs / 15000;
            const offset = (2 * Math.PI * 92) * (1 - pct);
            document.getElementById('poiCircle').setAttribute('stroke-dashoffset', offset);
        }

        function closePOI() {
            state.poiActive = false;
            if (state.poiInterval) { clearInterval(state.poiInterval); state.poiInterval = null; }
            document.getElementById('poiOverlay').classList.add('hidden-view');
        }

        /* ============ PREP TIMER ============ */
        function tickPrep() {
            const now = performance.now();
            if (state.prepRunning) {
                state.prepElapsedMs += now - state.prepLastTick;
                if (state.prepElapsedMs >= state.prepTotalMs) {
                    state.prepElapsedMs = state.prepTotalMs;
                    state.prepRunning = false;
                    playBell(2);
                    document.getElementById('prepPlayBtn').innerHTML = '▶ Start';
                    document.getElementById('prepStatus').textContent = '⏰ Prep time is over!';
                }
            }
            state.prepLastTick = now;
            const remaining = Math.max(0, state.prepTotalMs - state.prepElapsedMs);
            document.getElementById('prepTimer').textContent = formatTime(remaining);
        }

        function startPrep() {
            ensureAudio();
            if (state.prepElapsedMs >= state.prepTotalMs) return;
            state.prepRunning = true;
            state.prepLastTick = performance.now();
            document.getElementById('prepPlayBtn').innerHTML = '⏸ Running...';
            document.getElementById('prepStatus').textContent = 'In progress — focus on your case';
        }

        function pausePrep() {
            state.prepRunning = false;
            document.getElementById('prepPlayBtn').innerHTML = '▶ Resume';
            document.getElementById('prepStatus').textContent = 'Paused';
        }

        function resetPrep() {
            state.prepElapsedMs = 0;
            state.prepRunning = false;
            document.getElementById('prepPlayBtn').innerHTML = '▶ Start';
            document.getElementById('prepStatus').textContent = 'Ready to start';
            document.getElementById('prepTimer').textContent = formatTime(state.prepTotalMs);
        }

        function addPrepTime(seconds) {
            state.prepTotalMs += seconds * 1000;
            if (state.prepTotalMs < 0) state.prepTotalMs = 0;
            if (state.prepElapsedMs > state.prepTotalMs) state.prepElapsedMs = state.prepTotalMs;
            document.getElementById('prepTimer').textContent = formatTime(Math.max(0, state.prepTotalMs - state.prepElapsedMs));
        }

        /* ============ WAKE LOCK ============ */
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                if (state.wakeLock) return;
                state.wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('wakeLockIcon').textContent = '🔒';
                state.wakeLock.addEventListener('release', () => {
                    state.wakeLock = null;
                    document.getElementById('wakeLockIcon').textContent = '🔓';
                });
            } catch (e) { console.warn('Wake lock failed:', e); }
        }

        async function toggleWakeLock() {
            if (state.wakeLock) {
                await state.wakeLock.release();
                state.wakeLock = null;
                document.getElementById('wakeLockIcon').textContent = '🔓';
            } else {
                await requestWakeLock();
            }
        }

        /* ============ VIEW SWITCHING ============ */
        function showPrep() {
            document.getElementById('mainView').classList.add('hidden-view');
            document.getElementById('prepView').classList.remove('hidden-view');
            document.body.classList.remove('phase-black', 'phase-green', 'phase-yellow', 'phase-red', 'overtime-blink');
            document.body.classList.add('phase-prep');
            state.currentPhaseKey = 'prep';
        }

        function showMain() {
            document.getElementById('prepView').classList.add('hidden-view');
            document.getElementById('mainView').classList.remove('hidden-view');
            document.body.classList.remove('phase-prep');
            state.currentPhaseKey = null;
            updatePhaseUI();
        }

        /* ============ EVENT BINDINGS ============ */
        document.getElementById('playBtn').addEventListener('click', togglePlay);

        // RESET — discards the current attempt, does NOT log
        document.getElementById('resetBtn').addEventListener('click', resetCurrentSpeaker);

        document.getElementById('nextBtn').addEventListener('click', nextSpeaker);
        document.getElementById('prevBtn').addEventListener('click', prevSpeaker);
        document.getElementById('subTimeBtn').addEventListener('click', () => adjustTime(-10000));
        document.getElementById('addTimeBtn').addEventListener('click', () => adjustTime(10000));
        document.getElementById('poiBtn').addEventListener('click', startPOI);
        document.getElementById('poiCloseBtn').addEventListener('click', closePOI);
        document.getElementById('wakeLockBtn').addEventListener('click', toggleWakeLock);
        document.getElementById('manualBellBtn').addEventListener('click', () => { ensureAudio(); playBell(1); });

        document.getElementById('toPrepBtn').addEventListener('click', showPrep);
        document.getElementById('toMainBtn').addEventListener('click', showMain);

        document.getElementById('logsBtn').addEventListener('click', () => toggleLogsModal(true));
        document.getElementById('closeLogsBtn').addEventListener('click', () => toggleLogsModal(false));
        document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);

        document.getElementById('prepPlayBtn').addEventListener('click', () => {
            if (state.prepRunning) pausePrep(); else startPrep();
        });
        document.getElementById('prepPauseBtn').addEventListener('click', pausePrep);
        document.getElementById('prepResetBtn').addEventListener('click', resetPrep);
        document.getElementById('prepBellBtn').addEventListener('click', () => { ensureAudio(); playBell(2); });
        document.querySelectorAll('.prepAddBtn').forEach(btn => {
            btn.addEventListener('click', () => addPrepTime(parseInt(btn.dataset.prepAdd, 10)));
        });

        /* ============ KEYBOARD SHORTCUTS ============ */
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const onMain = !document.getElementById('prepView').classList.contains('hidden-view') ? false : true;
            const logsClosed = document.getElementById('logsModal').classList.contains('hidden-view');
            if (!onMain || !logsClosed) return;

            const poiVisible = !document.getElementById('poiSection').classList.contains('hidden');

            if (e.code === 'Space') {
                e.preventDefault();
                if (state.poiActive) {
                    closePOI();
                } else if (poiVisible) {
                    startPOI();
                }
            } else if (e.code === 'Enter') {
                e.preventDefault();
                resetCurrentSpeaker(); // reset only — does NOT log
            } else if (e.key === 'ArrowRight') {
                nextSpeaker();
            } else if (e.key === 'ArrowLeft') {
                prevSpeaker();
            }
        });

        /* Resume wake lock on tab focus */
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state.running && !state.wakeLock) requestWakeLock();
        });

        /* ============ BOOT ============ */
        updateSpeakerInfo();
        updatePhaseUI();
        state.lastTick = performance.now();
        state.prepLastTick = performance.now();
        setInterval(tick, 100);
        setInterval(tickPrep, 100);

        document.addEventListener('click', () => ensureAudio(), { once: true });
        document.addEventListener('touchstart', () => ensureAudio(), { once: true });
    </script>
</body>

</html>
